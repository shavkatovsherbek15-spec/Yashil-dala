services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: yashil
      POSTGRES_PASSWORD: yashil
      POSTGRES_DB: yashil_dala
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yashil -d yashil_dala"]
      interval: 5s
      retries: 10

  web:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://yashil:yashil@db:5432/yashil_dala
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
